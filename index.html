<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CxD Beauty 保養小測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, warm, unhurried — a beautician's consultation, not a sales pitch
   IDEA: the paper consultation card handed over at the counter, filled in one line at a time
   PICTURE: the card itself — one question at a time, large tappable answers, a soft progress line
   COLOUR and TYPE: 米杏 ground, deep mocha ink, one taupe accent; Jost (Avant Garde kin) + Noto Sans TC
   LAYOUT: one centred card column, max 560px; result page reads top-down, LINE action last and largest */
:root{color-scheme:light dark;
--bg:light-dark(#efe6da,#221c17);--card:light-dark(#faf6f0,#2d2620);--ink:light-dark(#3a2f27,#efe6da);
--soft:light-dark(#7d6c5e,#b9a998);--line:light-dark(#e2d6c6,#43392f);--accent:light-dark(#8a6a52,#d2b393);
--pick:light-dark(#efe3d3,#3b3128);--btn:light-dark(#3a2f27,#efe6da);--btnink:light-dark(#faf6f0,#221c17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","Jost",system-ui,sans-serif;font-weight:400;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:clamp(20px,5vw,48px) 16px 56px}
.brand{font-family:Jost,sans-serif;font-weight:500;letter-spacing:.08em;font-size:15px;text-align:center;margin:0 0 4px}
.slogan{font-family:Jost,sans-serif;font-weight:300;font-size:13px;color:var(--soft);text-align:center;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,36px);box-shadow:0 18px 40px -28px rgba(58,47,39,.45)}
h1{font-size:clamp(26px,6vw,34px);line-height:1.2;font-weight:500;margin:0 0 12px;text-wrap:balance}
h2{font-size:21px;line-height:1.35;font-weight:500;margin:0 0 6px;text-wrap:balance}
h3{font-size:15px;font-weight:500;color:var(--accent);margin:26px 0 8px}
p{margin:0 0 12px}.muted{color:var(--soft);font-size:14px}
.choices{display:grid;gap:10px;margin:18px 0 4px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font:inherit;text-align:start;cursor:pointer;transition:background .2s,border-color .2s}
.choice small{display:block;color:var(--soft);font-size:13px;line-height:1.4}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed=true]{background:var(--pick);border-color:var(--accent)}
.choice .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--soft)}
.choice[aria-pressed=true] .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.choice.multi .dot{border-radius:5px}
.choice.multi[aria-pressed=true] .dot{background:var(--accent)}
.start{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.start .choice{flex-direction:column;align-items:flex-start;min-height:120px;padding:18px}
.start .choice b{font-weight:500;font-size:18px}
.bar{height:3px;background:var(--line);border-radius:3px;margin:0 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.step{font-family:Jost,sans-serif;font-size:13px;color:var(--soft);margin:0 0 6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.link{background:none;border:0;color:var(--soft);font:inherit;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}
.go{min-height:48px;padding:0 26px;border-radius:999px;border:0;background:var(--btn);color:var(--btnink);font:inherit;font-weight:500;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tag{display:inline-block;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 12px;margin-bottom:12px}
ul.tips{margin:0;padding-inline-start:1.2em}ul.tips li{margin:4px 0}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-of-type{border-top:0}
.item b{font-weight:500}.item span{display:block;color:var(--soft);font-size:14px}
.alt{font-size:14px;color:var(--soft);margin-top:4px}
.course{background:var(--pick);border-radius:16px;padding:16px 18px}
.course b{font-weight:500;font-size:18px}.course>span{display:block;color:var(--soft);font-size:14px;margin-bottom:8px}
.ing{font-size:14px;margin:6px 0 0;line-height:1.6}.ing em{font-style:normal;display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.also{border:1px dashed var(--line);border-radius:16px;padding:14px 18px;margin-top:10px;font-size:15px}
.also p{margin:0}.also .also-h{margin-bottom:4px}.also b{font-weight:500}
.prod{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}.prod b{font-weight:500}.prod span{display:block;color:var(--soft);font-size:14px}
.ph{width:84px;height:84px;border-radius:14px;border:1px dashed var(--soft);display:grid;place-items:center;font-size:12px;color:var(--soft);background:var(--card)}

.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin-top:28px;border-radius:999px;background:#06c755;color:#fff;text-decoration:none;font-weight:500;font-size:17px}

.ed-bar .msg{font-size:13px;color:var(--soft)}
.ed details{border-top:1px solid var(--line);padding:6px 0}.ed summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500}
.ed .grp{margin:8px 0 14px;padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.ed .gh{font-size:13px;color:var(--accent);margin:12px 0 4px}
.ed label{display:block;font-size:12px;color:var(--soft);margin:8px 0 2px}
.ed textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;field-sizing:content;min-height:44px}
.ed textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

    "偶爾做一次頭皮 SPA 放鬆",
    "記得也照顧肩頸"
   ],
   "course": [
    "角質代謝更新養護",
    "入門的頭皮保養療程，含肩頸紓壓",
    "茉莉、佛手柑、檜木精油淨化頭皮，SPA 舒壓洗髮與肩頸紓壓（約 2 小時）。"
   ],
   "alt": null,
   "prod": [
    [
     "真正薰衣草胺基酸洗髮精",
     "溫和清潔，適合日常",
     "薰衣草、積雪草、山梨醣醇"
    ]
   ]
  }
 },
 "SCALP_LIFE": {
  "helmet": "安全帽和帽子會把汗水和油脂悶在頭皮上，流汗後記得盡快清潔、吹乾。",
  "dye": "常染燙的頭皮比較容易乾、敏感，染燙前後都要多一點照顧。",
  "stress": "壓力和睡眠會直接影響頭皮狀態，好好休息也是保養。",
  "postpartum": "產後的身體正在調整，給頭皮多一點耐心和溫柔。",
  "blow": "天天吹整，髮絲需要護髮油保護，吹風機也別離太近。"
 },
 "WASH": {
  "daily": "",
  "two": "",
  "less": "洗頭間隔較長時，油脂和汗水容易堆積，天熱時可以縮短間隔。"
 }
}</script>
<script id="app-js">{
const DATA_EL=document.getElementById('cxd-data');
let D=JSON.parse(DATA_EL.textContent);
const PRISTINE_WRAP=document.getElementById('wrap').outerHTML;
const APP_JS=document.getElementById('app-js').textContent;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
let mode=null,i=0,ans={};
const qs=()=>D.Q[mode].filter(q=>!q.when||Object.entries(q.when).every(([k,v])=>ans[k]===v));
const U=()=>D.ui;

function chrome(){document.getElementById('slogan').textContent=U().slogan;document.getElementById('foot').textContent=U().foot}

function home(){
 mode=null;i=0;ans={};
 app.innerHTML=`<div class="fade"><h1>${esc(U().homeTitle)}</h1>
 <p class="muted">${nl(U().homeDesc)}</p>
 <div class="start">
  <button class="choice" data-mode="skin"><b>${esc(U().skinBtn)}</b><small>${esc(U().skinSub)}</small></button>
  <button class="choice" data-mode="scalp"><b>${esc(U().scalpBtn)}</b><small>${esc(U().scalpSub)}</small></button>
 </div></div>`;
 app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;i=0;ans={};ask()});
}

function ask(){
 const list=qs(),q=list[i],cur=ans[q.id],many=q.multi||q.max;
 const sel=v=>many?(cur||[]).includes(v):cur===v;
 app.innerHTML=`<div class="fade">
 <div class="bar"><i style="width:${(i/list.length)*100}%"></i></div>
 <p class="step">${i+1} / ${list.length}</p>
 <h2>${esc(q.t)}</h2>${q.hint?`<p class="muted">${esc(q.hint)}</p>`:''}
 <div class="choices">${q.o.map(([v,l,s])=>`<button class="choice${many?' multi':''}" data-v="${esc(v)}" aria-pressed="${sel(v)}"><span class="dot"></span><span>${esc(l)}${s?`<small>${esc(s)}</small>`:''}</span></button>`).join('')}</div>
 <div class="nav"><button class="link" id="back">${i?'上一題':'回首頁'}</button>${many?`<button class="go" id="next" ${(cur||[]).length?'':'disabled'}>下一題</button>`:''}</div></div>`;
 app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>pick(q,b.dataset.v));
 document.getElementById('back').onclick=()=>{if(i){i--;ask()}else home()};
 const n=document.getElementById('next');if(n)n.onclick=next;
}
function pick(q,v){
 if(q.multi||q.max){
  let a=ans[q.id]||[];
  if(a.includes(v))a=a.filter(x=>x!==v);
  else{const solo=['none','stable','fine'];a=solo.includes(v)?[v]:a.filter(x=>!solo.includes(x)).concat(v);if(q.max&&a.length>q.max)a=a.slice(-q.max)}
  ans[q.id]=a;ask();
 }else{ans[q.id]=v;setTimeout(next,180)}
}
function next(){const list=qs();if(i<list.length-1){i++;ask()}else result()}
function skinType(){
 const t=ans.type==='unsure'?ans.unsure:ans.type,s=ans.signal||[];
 if(ans.proc==='yes')return['postcare',s];
 if(t==='sens'||s.includes('red'))return['red',s.filter(x=>x!=='red')];
 if(s.length)return[s[0],s.slice(1)];
 return[t==='oily'?'oil':'tight',[]];
}
function scalpType(){const c=ans.care||[];if(c.length)return[c[0],c.slice(1)];return[{oily:'oil',dry:'sens',flaky:'flake',fine:'fine'}[ans.day],[]]}

function result(){
 const skin=mode==='skin',u=U();
 const [key,rest]=skin?skinType():scalpType();
 const SET=skin?D.SKIN:D.SCALP,R=SET[key],LIFE=skin?D.SKIN_LIFE:D.SCALP_LIFE;
 const daily=(ans.life||[]).filter(x=>LIFE[x]).map(x=>LIFE[x]);
 if(!skin&&D.WASH[ans.wash])daily.push(D.WASH[ans.wash]);
 const also=rest.filter(x=>SET[x]&&x!==key).map(x=>SET[x].name);
 let prods=R.prod;if(skin)prods=prods.slice(0,+ans.routine||2);
 const caution=skin&&key==='red'&&(ans.signal||[]).includes('oil')?`<p class="alt">${esc(u.caution)}</p>`:'';
 const msg=u.lineMsg.replace('{result}',R.name).replace('{course}',R.course[0]+(R.alt?`、${R.alt[0]}`:''));
 const href='https://lin.ee/NwF8S8h';
 const otherName=skin?u.scalpBtn:u.skinBtn;
 app.innerHTML=`<div class="fade">
 <div class="bar"><i style="width:100%"></i></div>
 <span class="tag">${esc(skin?u.skinBtn:u.scalpBtn)}｜${esc(u.resultTag)}</span>
 <h1>${esc(R.name)}</h1><p>${nl(R.line)}</p>
 ${also.length?`<p class="muted">${esc(u.also.replace('{x}',also.join('、')))}</p>`:''}
 ${daily.length?`<h3>${esc(u.dailyH)}</h3>${daily.map(d=>`<p>${nl(d)}</p>`).join('')}`:''}
 <h3>${esc(u.tipsH)}</h3><ul class="tips">${R.tips.filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
 <h3>${esc(u.courseH)}</h3>
 <div class="course"><b>${esc(R.course[0])}</b><span>${esc(R.course[1])}</span><p class="ing"><em>${esc(u.courseIng)}</em>${nl(R.course[2])}</p>${!skin?`<p class="alt">${esc(u.scalpNote)}</p>`:''}</div>
 ${R.alt?`<div class="also"><p class="also-h">${esc(u.altLabel)}<b>${esc(R.alt[0])}</b></p><p>${nl(R.alt[1])}</p></div>`:''}${caution}
 <h3>${esc(u.prodH)}</h3>${prods.map(([n,d,g])=>`<div class="prod"><div class="ph" aria-label="${esc(n)}">${esc(u.photo)}</div><div><b>${esc(n)}</b><span>${esc(d)}</span><p class="ing"><em>${esc(u.prodIng)}</em>${nl(g)}</p></div></div>`).join('')}
 <a class="cta" href="${esc(href)}" data-msg="${esc(msg)}" onclick="try{navigator.clipboard.writeText(this.dataset.msg)}catch(e){}" target="_blank" rel="noopener">${esc(skin?u.ctaSkin:u.ctaScalp)}</a>
 <p class="cta-note">${esc(u.ctaNote)}</p>
 <div class="after"><button class="link" id="again">${esc(u.again)}</button><button class="link" id="other">${esc(u.other.replace('{x}',otherName))}</button></div></div>`;
 document.getElementById('again').onclick=()=>{i=0;ans={};ask()};
 document.getElementById('other').onclick=()=>{mode=skin?'scalp':'skin';i=0;ans={};ask()};
 app.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 編輯模式（網址加 #edit） ---------- */
const UI_LABEL={slogan:'Logo 下方標語',homeTitle:'首頁標題',homeDesc:'首頁說明',skinBtn:'臉部按鈕文字',skinSub:'臉部按鈕小字',scalpBtn:'頭皮按鈕文字',scalpSub:'頭皮按鈕小字',resultTag:'結果標籤',also:'同時在意（{x} 會換成類型名稱）',dailyH:'標題：你的日常',tipsH:'標題：今天就能做的事',courseH:'標題：推薦療程',courseIng:'療程成分小標',scalpNote:'頭皮療程附註',altLabel:'也可以試試 前綴',caution:'敏感＋出油時的提醒',prodH:'標題：居家搭配',prodIng:'產品成分小標',photo:'產品圖預留字',ctaSkin:'臉部 LINE 按鈕',ctaScalp:'頭皮 LINE 按鈕',ctaNote:'LINE 按鈕下方說明',lineMsg:'帶入 LINE 的訊息（{result} 結果、{course} 療程）',again:'重新測驗按鈕',other:'換做另一測驗（{x} 會換成名稱）',foot:'頁尾免責聲明'};
const LIFE_LABEL={helmet:'安全帽／口罩',ac:'冷氣房',outdoor:'戶外',late:'熬夜',shave:'刮鬍子',makeup:'化妝',dye:'染燙',stress:'壓力',postpartum:'產後',blow:'吹整',daily:'每天洗頭',two:'兩天洗一次',less:'更久洗一次'};
let draft=null,artifactNS=null;
const get=(o,p)=>p.reduce((a,k)=>a?.[k],o);
const setp=(o,p,v)=>{const l=p[p.length-1];get(o,p.slice(0,-1))[l]=v};
const fld=(label,p)=>`<label>${esc(label)}</label><textarea data-p='${esc(JSON.stringify(p))}' rows="1">${esc(get(draft,p))}</textarea>`;
function resultFields(setKey,k,R){
 const b=[setKey,k];let h=fld('類型名稱',[...b,'name'])+fld('一句話描述',[...b,'line']);
 h+=`<p class="gh">今天就能做的事</p>`+R.tips.map((t,j)=>fld(`提醒 ${j+1}`,[...b,'tips',j])).join('');
 h+=`<p class="gh">推薦療程</p>`+fld('療程名稱',[...b,'course',0])+fld('一句話說明',[...b,'course',1])+fld('成分與流程',[...b,'course',2]);
 if(R.alt)h+=`<p class="gh">也可以試試</p>`+fld('名稱',[...b,'alt',0])+fld('為什麼也推薦',[...b,'alt',1]);
 h+=`<p class="gh">居家搭配</p>`+R.prod.map((p,j)=>fld(`產品 ${j+1} 名稱`,[...b,'prod',j,0])+fld('一句話',[...b,'prod',j,1])+fld('主要成分',[...b,'prod',j,2])).join('');
 return h;
}
function editor(){
 const sec=(title,body,open)=>`<details${open?' open':''}><summary>${esc(title)}</summary><div class="grp">${body}</div></details>`;
 const qsec=m=>D.Q[m].map((q,qi)=>`<p class="gh">第 ${qi+1} 題</p>`+fld('題目',['Q',m,qi,'t'])+(q.hint!=null?fld('提示',['Q',m,qi,'hint']):'')+q.o.map((o,oi)=>fld(`選項 ${oi+1}`,['Q',m,qi,'o',oi,1])+(o[2]!=null?fld(`選項 ${oi+1} 小字`,['Q',m,qi,'o',oi,2]):'')).join('')).join('');
 const rsec=(sk)=>Object.entries(draft[sk]).map(([k,R])=>sec(R.name,resultFields(sk,k,R))).join('');
 const lsec=(sk)=>Object.keys(draft[sk]).map(k=>fld(LIFE_LABEL[k]||k,[sk,k])).join('');
 app.innerHTML=`<div class="ed">
 <div class="ed-bar"><span class="msg" id="edmsg">編輯模式：改好後按「儲存並發佈」</span><span><button class="go ghost" id="edcancel">取消</button> <button class="go" id="edsave">儲存並發佈</button></span></div>
 ${sec('基本設定與按鈕文字',fld('LINE 官方帳號 ID（例：@cxdbeauty）',['lineId'])+Object.keys(draft.ui).map(k=>fld(UI_LABEL[k]||k,['ui',k])).join(''),true)}
 ${sec('臉部肌膚：題目',qsec('skin'))}
 ${sec('臉部肌膚：結果類型',rsec('SKIN'))}
 ${sec('臉部肌膚：日常情境說明',lsec('SKIN_LIFE'))}
 ${sec('頭皮與髮絲：題目',qsec('scalp'))}
 ${sec('頭皮與髮絲：結果類型',rsec('SCALP'))}
 ${sec('頭皮與髮絲：日常情境與洗頭頻率說明',lsec('SCALP_LIFE')+lsec('WASH'))}
 </div>`;
 app.querySelectorAll('textarea').forEach(t=>t.oninput=()=>setp(draft,JSON.parse(t.dataset.p),t.value));
 document.getElementById('edcancel').onclick=()=>{location.hash='';draft=null;chrome();home()};
 document.getElementById('edsave').onclick=save;
}
function buildHTML(data){
 const h=document.head.cloneNode(true);
 h.querySelectorAll('script,base').forEach(n=>n.remove());
 const json=JSON.stringify(data,null,1).replace(/<\//g,'<\\/');
 return `<!DOCTYPE html>\n<html lang="zh-Hant">\n${h.outerHTML}\n<body>\n${PRISTINE_WRAP}\n<script type="application/json" id="cxd-data">${json}<\/script>\n<script id="app-js">${APP_JS}<\/script>\n</body>\n</html>`;
}
async function save(){
 const msg=document.getElementById('edmsg'),btn=document.getElementById('edsave');
 if(!artifactNS){msg.textContent='這個檢視無法儲存，請在 claude.ai 上以擁有者身分開啟。';return}
 btn.disabled=true;msg.textContent='儲存中…';
 try{await artifactNS.publish(buildHTML(draft));msg.textContent='已發佈，頁面會自動更新。'}
 catch(e){btn.disabled=false;msg.textContent=(e&&(e.code||e.message))==='conflict'?'有人同時更新了頁面，請重新整理後再改。':'沒有儲存成功：'+(e&&(e.code||e.message)||'請稍後再試')}
}
function route(){
 const h=location.hash.slice(1);
 if(h==='edit'){draft=JSON.parse(JSON.stringify(D));editor();
  if(window.claude&&claude.use)claude.use('artifact').then(a=>{artifactNS=a;if(!a){const m=document.getElementById('edmsg');if(m)m.textContent='可以編輯預覽，但這個檢視無法儲存。'}}).catch(()=>{});
  return}
 if(h==='skin'||h==='scalp'){mode=h;i=0;ans={};ask()}else home();
}
chrome();route();
window.addEventListener('hashchange',route);
}
</script>
</body>
</html>
